name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # A required check: the merge queue waits for it on the queued commit, whose subject is the title.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - name: The title is a conventional commit subject
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: printf '%s\n' "${TITLE%%$'\n'*}" | npx --no -- commitlint --verbose

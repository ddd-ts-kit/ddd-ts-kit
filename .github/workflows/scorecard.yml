name: Scorecard

# The OpenSSF Scorecard of the repository: how its supply chain is held (pinned actions, token
# permissions, branch protection, code review, signed releases, fuzzing, dangerous workflows...),
# scored from 0 to 10 and published on scorecard.dev for the badge of the README. Its findings
# also reach the code scanning alerts of the repository. Never a gate of a pull request.

on:
  push:
    branches: [main]
  # A change of the protection of a branch changes the score.
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The action refuses to publish unless its job holds these permissions alone and runs only the
    # actions it trusts: no setup of the repository here.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
